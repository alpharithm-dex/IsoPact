<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101f"/><stop offset="1" stop-color="#101b34"/></linearGradient>
    <linearGradient id="reason" x1="0" x2="1"><stop stop-color="#192c54"/><stop offset="1" stop-color="#263e70"/></linearGradient>
    <linearGradient id="settle" x1="0" x2="1"><stop stop-color="#153f3e"/><stop offset="1" stop-color="#1b5b50"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-opacity=".35"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#69e0c4"/></marker>
    <style>
      .title{font:700 40px system-ui,Segoe UI;fill:#f7fbff}.sub{font:500 18px system-ui,Segoe UI;fill:#a9bad7}.region{font:700 22px system-ui,Segoe UI;fill:#fff}.boxTitle{font:700 19px system-ui,Segoe UI;fill:#fff}.body{font:500 15px system-ui,Segoe UI;fill:#d7e2f2}.tiny{font:500 13px system-ui,Segoe UI;fill:#b9c8df}.box{stroke:#ffffff22;stroke-width:2;rx:18;filter:url(#shadow)}.line{stroke:#69e0c4;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="70" y="65" class="title">IsoPact — Application-Level Outcome Isolation</text>
  <text x="70" y="98" class="sub">Gemini reasons. Deterministic policy authorizes. Authenticated evidence settles.</text>

  <rect x="70" y="135" width="1460" height="80" rx="18" fill="#18253f" class="box"/>
  <text x="800" y="168" text-anchor="middle" class="boxTitle">CUSTOMER / ENTERPRISE EVENT</text>
  <text x="800" y="195" text-anchor="middle" class="body">Example: $200 missing order creates competing refund, replacement, goodwill, and retry intent</text>

  <rect x="70" y="255" width="650" height="300" rx="24" fill="url(#reason)" class="box"/>
  <text x="105" y="298" class="region">REASONING PLANE · europe-west1</text>
  <text x="105" y="326" class="tiny">Gemini Enterprise Agent Runtime · Google ADK · Gemini 3.5 Flash</text>
  <g>
    <rect x="105" y="360" width="135" height="80" fill="#304b82" class="box"/><text x="172" y="393" text-anchor="middle" class="boxTitle">Support</text><text x="172" y="418" text-anchor="middle" class="tiny">financial remedy</text>
    <rect x="255" y="360" width="135" height="80" fill="#304b82" class="box"/><text x="322" y="393" text-anchor="middle" class="boxTitle">Fulfillment</text><text x="322" y="418" text-anchor="middle" class="tiny">delivery remedy</text>
    <rect x="405" y="360" width="135" height="80" fill="#304b82" class="box"/><text x="472" y="393" text-anchor="middle" class="boxTitle">Retention</text><text x="472" y="418" text-anchor="middle" class="tiny">relationship</text>
    <rect x="555" y="360" width="130" height="80" fill="#304b82" class="box"/><text x="620" y="393" text-anchor="middle" class="boxTitle">Resolver</text><text x="620" y="418" text-anchor="middle" class="tiny">recovery plan</text>
  </g>
  <text x="105" y="480" class="body">Managed Agent Identity · Memory Bank (non-authoritative)</text>
  <text x="105" y="510" class="body">Model Armor boundary · signed minimal action intent</text>
  <rect x="105" y="525" width="455" height="1" fill="#ffffff33"/>

  <rect x="780" y="255" width="750" height="450" rx="24" fill="url(#settle)" class="box"/>
  <text x="815" y="298" class="region">SETTLEMENT / DATA PLANE · africa-south1</text>
  <rect x="815" y="330" width="330" height="120" fill="#237263" class="box"/>
  <text x="980" y="365" text-anchor="middle" class="boxTitle">IsoPact Outcome Gateway · Cloud Run</text>
  <text x="980" y="393" text-anchor="middle" class="body">STS JWT authentication · semantic reservation</text>
  <text x="980" y="419" text-anchor="middle" class="body">capability + deterministic invariant authorization</text>
  <rect x="1180" y="330" width="315" height="120" fill="#225b56" class="box"/>
  <text x="1337" y="365" text-anchor="middle" class="boxTitle">Enterprise adapters</text>
  <text x="1337" y="393" text-anchor="middle" class="body">payment · carrier · warehouse</text>
  <text x="1337" y="419" text-anchor="middle" class="body">CRM / Jira · authenticated evidence</text>
  <rect x="815" y="485" width="210" height="90" fill="#225b56" class="box"/><text x="920" y="518" text-anchor="middle" class="boxTitle">Firestore</text><text x="920" y="544" text-anchor="middle" class="tiny">Pact Graph · slots</text><text x="920" y="562" text-anchor="middle" class="tiny">claims · UNKNOWN</text>
  <rect x="1045" y="485" width="210" height="90" fill="#225b56" class="box"/><text x="1150" y="518" text-anchor="middle" class="boxTitle">Pub/Sub evidence</text><text x="1150" y="544" text-anchor="middle" class="tiny">async authoritative</text><text x="1150" y="562" text-anchor="middle" class="tiny">transport</text>
  <rect x="1275" y="485" width="220" height="90" fill="#225b56" class="box"/><text x="1385" y="518" text-anchor="middle" class="boxTitle">Evidence reducer</text><text x="1385" y="544" text-anchor="middle" class="tiny">rank 1–5 · corrections</text><text x="1385" y="562" text-anchor="middle" class="tiny">source state machines</text>
  <rect x="815" y="605" width="315" height="70" fill="#237263" class="box"/><text x="972" y="637" text-anchor="middle" class="boxTitle">Invariant Engine</text><text x="972" y="659" text-anchor="middle" class="tiny">SETTLED or CONFLICT</text>
  <rect x="1165" y="605" width="330" height="70" fill="#237263" class="box"/><text x="1330" y="637" text-anchor="middle" class="boxTitle">Constrained reconciliation</text><text x="1330" y="659" text-anchor="middle" class="tiny">registry · approval · TOCTOU revalidation</text>

  <path d="M800 215 L800 300 L815 300" class="line"/>
  <path d="M720 405 L780 405" class="line"/>
  <text x="750" y="390" text-anchor="middle" class="tiny">signed intent</text>
  <path d="M1145 390 L1180 390" class="line"/>
  <path d="M980 450 L920 485" class="line"/>
  <path d="M1025 530 L1045 530" class="line"/>
  <path d="M1255 530 L1275 530" class="line"/>
  <path d="M1385 575 L1115 605" class="line"/>
  <path d="M1130 640 L1165 640" class="line"/>
  <path d="M1330 605 C1330 580 1180 585 1130 615" class="line"/>

  <rect x="70" y="750" width="930" height="150" rx="22" fill="#162944" class="box"/>
  <text x="105" y="790" class="region">PROVENANCE + OBSERVABILITY</text>
  <text x="105" y="827" class="body">Cloud KMS signed checkpoints + Settlement Receipt</text>
  <text x="105" y="858" class="body">OpenTelemetry → Cloud Trace · Cloud Logging · Cloud Monitoring</text>
  <text x="105" y="884" class="tiny">Observability explains causality; it never grants authority.</text>
  <path d="M920 705 L920 750" class="line"/>

  <rect x="1040" y="750" width="490" height="150" rx="22" fill="#20263b" stroke="#9ba8bd" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="1075" y="790" class="boxTitle">Deployment note — not canonical traffic</text>
  <text x="1075" y="827" class="body">Google Agent Gateway</text>
  <text x="1075" y="855" class="body">Provisioned · default deny · not bound</text>
  <text x="1075" y="883" class="tiny">A2A is not used in the canonical production flow.</text>

  <text x="70" y="955" class="tiny">Trust boundary: reasoning proposes → settlement authenticates and authorizes → evidence settles → KMS proves recorded integrity</text>
</svg>
