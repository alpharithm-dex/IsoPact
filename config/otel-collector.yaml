extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  googleclientauth:
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 65
    spike_limit_percentage: 20
  batch:
    timeout: 5s
  resourcedetection:
    detectors: [gcp]
    timeout: 10s
    override: true
  resource:
    attributes:
    - key: gcp.project_id
      value: isopact-agentic-20260823
      action: upsert
exporters:
  otlp:
    endpoint: telemetry.googleapis.com:443
    auth:
      authenticator: googleclientauth
service:
  extensions: [health_check, googleclientauth]
  pipelines:
    traces: {receivers: [otlp], processors: [memory_limiter, resourcedetection, resource, batch], exporters: [otlp]}
    metrics: {receivers: [otlp], processors: [memory_limiter, resourcedetection, resource, batch], exporters: [otlp]}
